version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergent_app
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=emergent_dev
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
      - AGENT_DEFAULT_TIER=e1
      - MAX_CONCURRENT_AGENTS=3
      - AGENT_TIMEOUT=300
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./memory:/app/memory
      - ./test_reports:/app/test_reports
      - agent_cache:/app/.cache
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - emergent_network

  mongo:
    image: mongo:7
    container_name: emergent_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=emergent_dev
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - emergent_network

  redis:
    image: redis:7-alpine
    container_name: emergent_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emergent_network

networks:
  emergent_network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  agent_cache: