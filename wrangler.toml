name = "vibesdk-python-worker"
main = "src/main.py"
compatibility_date = "2024-01-01"

# Python Workers configuration
[python]
# Automatically detected from main = "src/main.py"

# KV Namespaces for storage
[[kv_namespaces]]
binding = "API_KEYS"
id = "" # Run: wrangler kv:namespace create "API_KEYS"

[[kv_namespaces]]
binding = "GITHUB_CACHE"
id = "" # Run: wrangler kv:namespace create "GITHUB_CACHE"

# Secrets (set via: wrangler secret put SECRET_NAME)
# - GITHUB_TOKEN
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY

[build]
command = "" # No build needed for Python

# Observability
[observability]
enabled = true
